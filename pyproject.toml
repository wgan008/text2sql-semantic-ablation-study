[project]
name = "text2sql-semantic-ablation-study"
version = "0.1.0"
description = "Ablation study of semantic context for Text-to-SQL"
requires-python = ">=3.10"
dependencies = [
  "google-genai>=1.0",
  "google-cloud-bigquery>=3.0",
  "duckdb>=1.0",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "tenacity>=8.0",
  "tqdm>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
